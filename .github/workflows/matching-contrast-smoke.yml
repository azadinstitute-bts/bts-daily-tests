name: Temporary Matching Contrast Smoke

on:
  push:
    branches:
      - hotfix-matching-dark-contrast-20260920
    paths:
      - .github/workflows/matching-contrast-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify root/docs parity
        shell: bash
        run: |
          set -euo pipefail
          cmp -s assets/bts-parity-6078.css docs/assets/bts-parity-6078.css
          grep -F 'html[data-bts-theme="dark"] .glass-panel{background:var(--color-surface)!important;color:var(--color-text-main)!important}' assets/bts-parity-6078.css
          grep -F 'html[data-bts-theme="dark"] .q-content{color:var(--color-text-main)}' assets/bts-parity-6078.css

      - name: Install Chromium harness
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser contrast smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > matching-contrast-fixture.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <link rel="stylesheet" href="assets/index-wuAJsdPM.css">
              <link rel="stylesheet" href="assets/bts-parity-6078.css">
            </head>
            <body>
              <div class="glass-panel" style="padding:16px">
                <div class="q-content">
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                    <div style="border:1px solid var(--color-border);border-radius:8px;padding:.6rem">
                      <div style="font-weight:800;color:var(--navy)">List-I</div>
                      <div style="display:flex;gap:.3rem"><strong style="color:var(--navy)">(A):</strong><span id="matching-text">ALPHA_VISIBLE_TEXT</span></div>
                    </div>
                    <div style="border:1px solid var(--color-border);border-radius:8px;padding:.6rem">
                      <div style="font-weight:800;color:var(--navy)">List-II</div>
                      <div style="display:flex;gap:.3rem"><strong style="color:var(--navy)">(1):</strong><span>ONE_VISIBLE_TEXT</span></div>
                    </div>
                  </div>
                </div>
              </div>
            </body>
          </html>
          HTML

          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/matching-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/matching-contrast-fixture.html >/dev/null && break
            sleep .25
          done

          cat > matching-contrast-smoke.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          await page.goto('http://127.0.0.1:4173/matching-contrast-fixture.html',{waitUntil:'domcontentloaded'});

          function parseRgb(s){
            const m=s.match(/[\d.]+/g);
            return m ? m.slice(0,3).map(Number) : [0,0,0];
          }
          function luminance(s){
            return parseRgb(s).map(v=>{
              v/=255;
              return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);
            }).reduce((acc,v,i)=>acc+v*[0.2126,0.7152,0.0722][i],0);
          }
          function ratio(a,b){
            const x=luminance(a),y=luminance(b);
            return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);
          }
          async function sample(theme){
            await page.evaluate(t=>{document.documentElement.dataset.btsTheme=t;},theme);
            await page.waitForTimeout(50);
            return page.locator('#matching-text').evaluate(el=>{
              const panel=el.closest('.glass-panel');
              return {
                text:getComputedStyle(el).color,
                panelBg:getComputedStyle(panel).backgroundColor,
                panelColor:getComputedStyle(panel).color,
                contentColor:getComputedStyle(el.closest('.q-content')).color
              };
            });
          }

          const light=await sample('light');
          const dark=await sample('dark');
          const lightRatio=ratio(light.text,light.panelBg);
          const darkRatio=ratio(dark.text,dark.panelBg);

          console.log('LIGHT',JSON.stringify({...light,ratio:lightRatio}));
          console.log('DARK',JSON.stringify({...dark,ratio:darkRatio}));

          assert.ok(lightRatio>=4.5,'light matching contrast below 4.5: '+lightRatio);
          assert.ok(darkRatio>=4.5,'dark matching contrast below 4.5: '+darkRatio);
          assert.notEqual(dark.panelBg,'rgb(255, 255, 255)','dark glass panel remained white');
          assert.equal(dark.text,dark.contentColor,'matching row text did not inherit q-content color');

          console.log('MATCHING_CONTRAST_PASS');
          await browser.close();
          NODE

          node matching-contrast-smoke.mjs
