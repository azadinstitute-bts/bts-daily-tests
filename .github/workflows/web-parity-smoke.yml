name: Temporary Live Web Diagnostic

on:
  push:
    branches:
      - web-parity-6078-20260920
    paths:
      - .github/workflows/web-parity-smoke.yml
  workflow_dispatch:

jobs:
  diagnose-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify deployed critical assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bilaspurtestseries.com/bts-daily-tests"
          Q="?verify=719e23b76dd5e6c71b05d36c6c25768533332f27"
          for f in             assets/index-D6L0VNZw.js             assets/index-wuAJsdPM.css             assets/bts-parity-6078.js             assets/bts-parity-6078.css; do
            curl -fLsS -H 'Cache-Control: no-cache' "$BASE/$f$Q" -o "/tmp/$(basename "$f")"
            cmp -s "$f" "/tmp/$(basename "$f")"
            echo "LIVE_ASSET_MATCH:$f"
          done

      - name: Install Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Diagnose live Free Demo read-only
        shell: bash
        run: |
          set -euo pipefail
          cat > live-diagnostic.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const URL='https://bilaspurtestseries.com/bts-daily-tests/#/login';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const page=await context.newPage();

          const api=[];
          const pageErrors=[];
          const consoleMessages=[];
          const failed=[];

          page.on('pageerror', e => {
            pageErrors.push(String(e));
            console.log('PAGEERROR:'+String(e));
          });
          page.on('console', m => {
            consoleMessages.push({type:m.type(),text:m.text()});
            console.log('CONSOLE:'+m.type()+':'+m.text());
          });
          page.on('requestfailed', req => {
            failed.push({url:req.url(),failure:req.failure()?.errorText||''});
            console.log('REQUEST_FAILED:'+req.url()+':'+(req.failure()?.errorText||''));
          });
          page.on('request', req => {
            if(!req.url().includes('/functions/v1/student-api')) return;
            let body={};
            try{body=req.postDataJSON()||{}}catch{}
            api.push({phase:'request',url:req.url(),body});
            console.log('API_REQUEST:'+JSON.stringify(body));
          });
          page.on('response', async res => {
            if(!res.url().includes('/functions/v1/student-api')) return;
            let body='';
            try{body=await res.text()}catch(e){body='READ_ERROR:'+e}
            api.push({phase:'response',url:res.url(),status:res.status(),body});
            console.log('API_RESPONSE:'+res.status()+':'+body.slice(0,4000));
          });

          await page.goto(URL,{waitUntil:'domcontentloaded',timeout:60000});

          const consent=page.getByRole('button',{name:/I Agree & Continue/i});
          if(await consent.isVisible().catch(()=>false)){
            console.log('CONSENT_VISIBLE:true');
            await consent.click();
          } else {
            console.log('CONSENT_VISIBLE:false');
          }

          await page.getByRole('heading',{name:'BTS Portal'}).waitFor({timeout:30000});
          await page.getByRole('button',{name:'Free Demo'}).waitFor();
          await page.getByRole('button',{name:/Call Support/}).waitFor();
          console.log('LOGIN_SURFACE_PASS');

          await page.getByRole('button',{name:'Free Demo'}).click();
          await page.waitForTimeout(5000);

          console.log('URL_AFTER_CLICK:'+page.url());
          console.log('SELECT_COUNT:'+await page.locator('select').count());
          console.log('COMBOBOX_COUNT:'+await page.getByRole('combobox').count());
          console.log('BODY_TEXT_BEGIN');
          console.log((await page.locator('body').innerText()).slice(0,8000));
          console.log('BODY_TEXT_END');

          const select=page.getByRole('combobox');
          await select.waitFor({state:'visible',timeout:10000});
          await page.waitForFunction(() => {
            const s=document.querySelector('select');
            return !!s && s.options.length >= 10;
          },null,{timeout:20000});

          const options=await select.locator('option').allTextContents();
          console.log('DEMO_OPTIONS:'+JSON.stringify(options));
          assert.ok(options.some(x=>/varg 2 hindi/i.test(x)),'live Varg 2 Hindi missing');
          assert.ok(options.some(x=>/varg 2 english/i.test(x)),'live Varg 2 English missing');

          const request=api.find(x=>x.phase==='request'&&x.body?.action==='get_demo_courses');
          const response=api.find(x=>x.phase==='response');
          assert.ok(request,'get_demo_courses request not observed');
          assert.ok(response && response.status===200,'student-api response not HTTP 200');
          assert.equal(request.body.app_version_code,6078);
          assert.equal(request.body.client_build,6078);
          assert.equal(request.body.api_contract_version,1);
          assert.equal(request.body.client_version,'web-6078');

          assert.equal(pageErrors.length,0,'page errors: '+pageErrors.join(' | '));
          const criticalConsole=consoleMessages.filter(x=>x.type==='error'&&!/favicon/i.test(x.text));
          assert.equal(criticalConsole.length,0,'console errors: '+criticalConsole.map(x=>x.text).join(' | '));
          assert.equal(failed.filter(x=>x.url.includes('/functions/v1/student-api')).length,0,'student-api request failed');

          console.log('LIVE_DIAGNOSTIC_PASS');
          console.log('LIVE_METADATA_PASS:web-6078/6078');
          console.log('LIVE_DEMO_COURSES:'+options.length);
          await browser.close();
          NODE

          node live-diagnostic.mjs
