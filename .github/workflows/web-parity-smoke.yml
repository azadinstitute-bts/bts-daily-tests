name: Temporary Live Web Verification

on:
  push:
    branches:
      - web-parity-6078-20260920
    paths:
      - .github/workflows/web-parity-smoke.yml
  workflow_dispatch:

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compare deployed bytes with main
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bilaspurtestseries.com/bts-daily-tests"
          Q="?verify=719e23b76dd5e6c71b05d36c6c25768533332f27"
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/$Q" -o /tmp/live-index.html
          grep -F '/bts-daily-tests/assets/index-D6L0VNZw.js' /tmp/live-index.html
          grep -F '/bts-daily-tests/assets/bts-parity-6078.js' /tmp/live-index.html
          grep -F '/bts-daily-tests/assets/bts-parity-6078.css' /tmp/live-index.html
          cmp -s index.html /tmp/live-index.html || {
            echo "Index bytes differ; checking required deployment wiring instead."
            diff -u index.html /tmp/live-index.html || true
          }

          for f in             assets/index-D6L0VNZw.js             assets/index-wuAJsdPM.css             assets/bts-parity-6078.js             assets/bts-parity-6078.css; do
            curl -fLsS -H 'Cache-Control: no-cache' "$BASE/$f$Q" -o "/tmp/$(basename "$f")"
            cmp -s "$f" "/tmp/$(basename "$f")" || {
              echo "LIVE_ASSET_MISMATCH:$f"
              exit 1
            }
            echo "LIVE_ASSET_MATCH:$f"
          done

      - name: Install Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Live read-only browser verification
        shell: bash
        run: |
          set -euo pipefail
          cat > live-verify.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const URL = 'https://bilaspurtestseries.com/bts-daily-tests/#/login';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          const page = await context.newPage();

          const pageErrors = [];
          const consoleErrors = [];
          const apiBodies = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          page.on('request', req => {
            if (!req.url().includes('/functions/v1/student-api')) return;
            try {
              const b = req.postDataJSON();
              if (b) apiBodies.push(b);
            } catch {}
          });

          await page.goto(URL, {waitUntil:'domcontentloaded', timeout:60000});

          const consent = page.getByRole('button', {name:/I Agree & Continue/i});
          if (await consent.isVisible().catch(()=>false)) {
            await consent.click();
          }

          await page.getByRole('heading', {name:'BTS Portal'}).waitFor({timeout:30000});
          await page.getByRole('button', {name:'Student Login'}).waitFor();
          await page.getByRole('button', {name:'Free Demo'}).waitFor();
          await page.getByRole('button', {name:/Call Support/}).waitFor();

          await page.getByRole('button', {name:'Free Demo'}).click();
          const select = page.getByLabel('Select Demo Course');
          await select.waitFor();
          await page.waitForFunction(() => {
            const s = document.querySelector('select');
            return !!s && s.options.length >= 10;
          }, null, {timeout:30000});

          const options = await select.locator('option').allTextContents();
          assert.ok(options.some(x => /varg 2 hindi/i.test(x)), 'live Varg 2 Hindi missing');
          assert.ok(options.some(x => /varg 2 english/i.test(x)), 'live Varg 2 English missing');

          const demoCall = apiBodies.find(x => x.action === 'get_demo_courses');
          assert.ok(demoCall, 'live get_demo_courses request not observed');
          assert.equal(demoCall.app_version_code, 6078);
          assert.equal(demoCall.client_build, 6078);
          assert.equal(demoCall.api_contract_version, 1);
          assert.equal(demoCall.client_version, 'web-6078');

          assert.equal(pageErrors.length, 0, 'page errors: ' + pageErrors.join(' | '));
          const critical = consoleErrors.filter(x => !/favicon/i.test(x));
          assert.equal(critical.length, 0, 'console errors: ' + critical.join(' | '));

          console.log('LIVE_VERIFY_PASS');
          console.log('LIVE_DEMO_COURSES:' + options.length);
          console.log('LIVE_METADATA_PASS:web-6078/6078');
          await browser.close();
          NODE

          node live-verify.mjs
