name: Temporary Live Demo Login Verification

on:
  push:
    branches:
      - diagnose-live-demo-login-20260920
    paths:
      - .github/workflows/live-demo-login-diagnostic.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify live demo login
        run: |
          cat > live-demo-verify.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const actions=[];
          const responses=[];

          page.on('request',req=>{
            if(req.url().includes('/functions/v1/student-api')){
              try{actions.push((req.postDataJSON()||{}).action)}catch{}
            }
          });
          page.on('response',async res=>{
            if(!res.url().includes('/functions/v1/student-api'))return;
            let body='';try{body=await res.text()}catch{}
            responses.push({status:res.status(),body});
          });

          await page.goto('https://bilaspurtestseries.com/bts-daily-tests/#/login',{waitUntil:'domcontentloaded',timeout:60000});
          const consent=page.getByRole('button',{name:/I Agree & Continue/i});
          if(await consent.isVisible().catch(()=>false)) await consent.click();

          await page.getByRole('heading',{name:'BTS Portal'}).waitFor({timeout:30000});
          await page.getByRole('button',{name:'Free Demo'}).click();
          const select=page.getByRole('combobox');
          await select.waitFor({timeout:30000});
          await page.waitForFunction(()=>document.querySelector('select')?.options.length>=10,null,{timeout:30000});

          await page.locator('input').nth(0).fill('Smoke Test');
          await page.locator('input').nth(1).fill('9999999999');
          await select.selectOption({index:0});
          await page.getByRole('button',{name:'Start Free Demo'}).click();

          await page.getByText('Welcome Back,').waitFor({timeout:30000});
          await page.waitForTimeout(4000);

          const state=await page.evaluate(()=>({hash:location.hash,body:document.body.innerText.slice(0,5000)}));
          const dashboards=actions.filter(x=>x==='get_dashboard').length;
          console.log('ACTIONS:'+JSON.stringify(actions));
          console.log('GET_DASHBOARD_COUNT:'+dashboards);
          console.log('FINAL_HASH:'+state.hash);

          assert.equal(state.hash,'#/','live demo did not remain on dashboard');
          assert.match(state.body,/Welcome Back/i,'live dashboard did not render');
          assert.ok(actions.includes('upgrade_demo_session'),'upgrade call missing');
          assert.ok(actions.includes('verify_session'),'verify call missing');
          assert.ok(dashboards>=1 && dashboards<=2,'live dashboard request storm: '+dashboards);
          assert.ok(responses.some(x=>x.status===200 && x.body.includes('"status":"SUCCESS"')),'no successful live API response');

          console.log('LIVE_DEMO_LOGIN_PASS');
          await browser.close();
          NODE
          node live-demo-verify.mjs
