name: Temporary Patched Demo Login Smoke

on:
  push:
    branches:
      - diagnose-live-demo-login-20260920
    paths:
      - .github/workflows/live-demo-login-diagnostic.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-demo-login-stability-20260920

      - name: Verify helper
        run: |
          cmp -s assets/bts-parity-6078.js docs/assets/bts-parity-6078.js
          node --check assets/bts-parity-6078.js

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Demo login smoke
        run: |
          cd ..
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          cd bts-daily-tests
          cat > demo-smoke.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const actions=[];
          page.on('request',req=>{
            if(req.url().includes('/functions/v1/student-api')){
              try{actions.push((req.postDataJSON()||{}).action)}catch{}
            }
          });
          await page.goto('http://127.0.0.1:4173/bts-daily-tests/#/login',{waitUntil:'domcontentloaded'});
          const consent=page.getByRole('button',{name:/I Agree & Continue/i});
          if(await consent.isVisible().catch(()=>false)) await consent.click();
          await page.getByRole('heading',{name:'BTS Portal'}).waitFor({timeout:30000});
          await page.getByRole('button',{name:'Free Demo'}).click();
          const select=page.getByRole('combobox');
          await select.waitFor({timeout:30000});
          await page.waitForFunction(()=>document.querySelector('select')?.options.length>=10,null,{timeout:30000});
          await page.locator('input').nth(0).fill('Smoke Test');
          await page.locator('input').nth(1).fill('9999999999');
          await select.selectOption({index:0});
          await page.getByRole('button',{name:'Start Free Demo'}).click();
          await page.getByText('Welcome Back,').waitFor({timeout:30000});
          await page.waitForTimeout(4000);
          const hash=await page.evaluate(()=>location.hash);
          const count=actions.filter(x=>x==='get_dashboard').length;
          console.log('ACTIONS:'+JSON.stringify(actions));
          console.log('GET_DASHBOARD_COUNT:'+count);
          assert.equal(hash,'#/');
          assert.ok(count>=1 && count<=2,'dashboard request storm: '+count);
          console.log('DEMO_LOGIN_STABILITY_PASS');
          await browser.close();
          NODE
          node demo-smoke.mjs
