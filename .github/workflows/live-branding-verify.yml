name: Temporary Live BTS Branding Verification

on:
  push:
    branches:
      - branding-logo-placement-20260920
    paths:
      - .github/workflows/live-branding-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify live deployed bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bilaspurtestseries.com/bts-daily-tests"
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/assets/bts-logo.png?verify=ba141c2f" -o /tmp/live-logo.png
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/assets/bts-parity-6078.js?verify=ba141c2f" -o /tmp/live-helper.js
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/assets/bts-parity-6078.css?verify=ba141c2f" -o /tmp/live-helper.css
          curl -fLsS -H 'Cache-Control: no-cache' "$BASE/?verify=ba141c2f" -o /tmp/live-index.html
          cmp -s assets/bts-logo.png /tmp/live-logo.png
          cmp -s assets/bts-parity-6078.js /tmp/live-helper.js
          cmp -s assets/bts-parity-6078.css /tmp/live-helper.css
          grep -F '/bts-daily-tests/assets/bts-logo.png' /tmp/live-index.html
          echo "LIVE_BRANDING_BYTES_PASS"

      - name: Install Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify public live screens
        shell: bash
        run: |
          set -euo pipefail
          cat > live-branding.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          await context.route('**/functions/v1/student-api',async route=>{
            let body={};try{body=route.request().postDataJSON()||{}}catch{}
            const reply=body.action==='get_demo_courses'
              ? {ok:true,status:'SUCCESS',courses:['CG Assistant Teacher (Varg 3)']}
              : {ok:true,status:'SUCCESS'};
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(reply)});
          });

          async function pageFor(hash){
            const p=await context.newPage();
            await p.addInitScript(()=>localStorage.setItem('bts_privacy_consent_agreed_v1','true'));
            await p.goto('https://bilaspurtestseries.com/bts-daily-tests/'+hash,{waitUntil:'domcontentloaded',timeout:60000});
            return p;
          }
          async function assertLogo(locator,label){
            await locator.waitFor({state:'visible',timeout:20000});
            await locator.evaluate(el=>new Promise((resolve,reject)=>{
              if(el.complete&&el.naturalWidth>0)return resolve(true);
              const t=setTimeout(()=>reject(new Error('logo timeout')),15000);
              el.addEventListener('load',()=>{clearTimeout(t);resolve(true)},{once:true});
              el.addEventListener('error',()=>{clearTimeout(t);reject(new Error('logo error'))},{once:true});
            }));
            const x=await locator.evaluate(el=>({w:el.naturalWidth,h:el.naturalHeight,src:el.src}));
            console.log(label+':'+JSON.stringify(x));
            assert.equal(x.w,512);
            assert.equal(x.h,512);
            assert.ok(x.src.endsWith('/bts-daily-tests/assets/bts-logo.png'));
          }

          {
            const p=await pageFor('#/login');
            await p.getByRole('heading',{name:'BTS Portal'}).waitFor({timeout:20000});
            await assertLogo(p.locator('.bts-brand-login-logo'),'LIVE_LOGIN');
            const href=await p.locator('link[rel="icon"]').getAttribute('href');
            assert.equal(href,'/bts-daily-tests/assets/bts-logo.png');
            await p.close();
          }
          {
            const p=await pageFor('#/privacy');
            await p.getByText('Privacy & Data Disclosure',{exact:true}).waitFor({timeout:20000});
            await assertLogo(p.locator('header .bts-brand-logo'),'LIVE_PRIVACY');
            assert.equal(await p.locator('header').getByText('B',{exact:true}).count(),0);
            await p.close();
          }
          {
            const p=await pageFor('#/guide');
            await p.getByText(/User Guide & Tutorial|यूज़र गाइड/).waitFor({timeout:20000});
            await assertLogo(p.locator('header .bts-brand-logo'),'LIVE_GUIDE');
            await p.close();
          }

          console.log('LIVE_BTS_BRANDING_PASS');
          await browser.close();
          NODE
          node live-branding.mjs
